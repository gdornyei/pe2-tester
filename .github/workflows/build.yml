name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests (protocol decoding against a recorded capture)
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Restore signing key
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        if: ${{ env.KS != '' }}
        run: echo "$KS" | base64 -d > app/release.jks
      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk pe2-tester.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pe2-tester-apk
          path: pe2-tester.apk
      - name: Publish "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pe2-tester.apk --title "PE2 Tester (build ${{ github.run_number }})" --notes "Automated build of ${{ github.sha }}. Unofficial app – not affiliated with Pockethernet." --latest
